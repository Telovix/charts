{{- $name := include "telovix-console.fullname" . -}}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace (printf "%s-secret" $name)) | default dict -}}
{{- $data := get $existing "data" | default dict -}}
{{- $consoleId := .Values.selfHosted.consoleId | default (printf "tlvc_%s" (uuidv4)) -}}
{{- if hasKey $data "CONSOLE_ID" }}{{ $consoleId = index $data "CONSOLE_ID" | b64dec }}{{ end -}}
{{- $pgPassword := randAlphaNum 48 -}}
{{- $chPassword := .Values.clickhouse.password | default (randAlphaNum 48) -}}
{{- if hasKey $data "POSTGRES_PASSWORD" }}{{ $pgPassword = index $data "POSTGRES_PASSWORD" | b64dec }}{{ end -}}
{{- if and .Values.bundledDatabases.enabled (hasKey $data "CLICKHOUSE_PASSWORD") }}{{ $chPassword = index $data "CLICKHOUSE_PASSWORD" | b64dec }}{{ end -}}
{{- if and .Values.bundledDatabases.enabled .Values.database.url }}{{ fail "Use bundledDatabases or database.url, not both" }}{{ end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "telovix-console.fullname" . }}-secret
  labels:
    {{- include "telovix-console.labels" . | nindent 4 }}
type: Opaque
stringData:
  CONSOLE_ID: {{ $consoleId | quote }}
  {{- if .Values.bundledDatabases.enabled }}
  DATABASE_URL: {{ printf "postgres://telovix_console:%s@%s-postgres:5432/telovix_console" $pgPassword $name | quote }}
  POSTGRES_PASSWORD: {{ $pgPassword | quote }}
  CLICKHOUSE_PASSWORD: {{ $chPassword | quote }}
  {{- else }}
  DATABASE_URL: {{ .Values.database.url | quote }}
  CLICKHOUSE_PASSWORD: {{ .Values.clickhouse.password | quote }}
  {{- end }}
  {{- if .Values.llm.apiKey }}
  TELOVIX_LLM_API_KEY: {{ .Values.llm.apiKey | quote }}
  {{- end }}
  {{- if .Values.bootstrap.adminEmail }}
  BOOTSTRAP_ADMIN_EMAIL: {{ .Values.bootstrap.adminEmail | quote }}
  BOOTSTRAP_ADMIN_PASSWORD_HASH: {{ .Values.bootstrap.adminPasswordHash | quote }}
  {{- end }}
  {{- if .Values.bootstrap.licenseBundle }}
  BOOTSTRAP_LICENSE_BUNDLE: {{ .Values.bootstrap.licenseBundle | quote }}
  {{- end }}
  {{- if .Values.managed.managementSecret }}
  TELOVIX_CONSOLE_MANAGEMENT_SECRET: {{ .Values.managed.managementSecret | quote }}
  {{- end }}
  {{- if .Values.smtp.password }}
  TELOVIX_CONSOLE_SMTP_PASSWORD: {{ .Values.smtp.password | quote }}
  {{- end }}
  {{- if .Values.packRegistry.sharedSecret }}
  TELOVIX_CONSOLE_PACK_REGISTRY_SHARED_SECRET: {{ .Values.packRegistry.sharedSecret | quote }}
  {{- end }}
  {{- if .Values.federation.centralApiKey }}
  TELOVIX_FEDERATION_CENTRAL_API_KEY: {{ .Values.federation.centralApiKey | quote }}
  {{- end }}
  {{- if .Values.federation.apiKey }}
  TELOVIX_FEDERATION_API_KEY: {{ .Values.federation.apiKey | quote }}
  {{- end }}
