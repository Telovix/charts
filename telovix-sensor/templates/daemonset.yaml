{{- $sensorValues := .Values.sensor | default dict -}}
{{- $telecomCapture := get $sensorValues "telecomCapture" | default dict -}}
{{- $captureDelivery := .Values.captureDelivery | default dict -}}
{{- $split := get $captureDelivery "enabled" | default false -}}
{{- if and $split (not .Values.hostPID) -}}
{{- fail "captureDelivery.enabled requires hostPID=true for capture-owner visibility of delivery-worker peer PIDs" -}}
{{- end -}}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "telovix-sensor.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "telovix-sensor.labels" . | nindent 4 }}
spec:
  minReadySeconds: {{ .Values.minReadySeconds }}
  selector:
    matchLabels:
      {{- include "telovix-sensor.selectorLabels" . | nindent 6 }}
  updateStrategy:
    {{- if $split }}
    type: OnDelete
    {{- else }}
    {{- toYaml .Values.updateStrategy | nindent 4 }}
    {{- end }}
  template:
    metadata:
      labels:
        {{- include "telovix-sensor.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        {{- if $split }}
        checksum/config: {{ get (include (print $.Template.BasePath "/configmap.yaml") . | fromYaml) "data" | toJson | sha256sum }}
        checksum/enrollment: {{- if .Values.sensor.existingSecret }} {{ .Values.sensor.existingSecret | sha256sum }}{{- else }} {{ get (include (print $.Template.BasePath "/secret.yaml") . | fromYaml) "stringData" | toJson | sha256sum }}{{- end }}
        {{- else }}
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/enrollment: {{- if .Values.sensor.existingSecret }} {{ .Values.sensor.existingSecret | sha256sum }}{{- else }} {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}{{- end }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "telovix-sensor.serviceAccountName" . }}
      hostPID: {{ .Values.hostPID }}
      hostNetwork: {{ .Values.hostNetwork }}
      hostIPC: {{ .Values.hostIPC }}
      dnsPolicy: {{ .Values.dnsPolicy }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.priorityClass.create }}
      priorityClassName: {{ .Values.priorityClass.name }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- $pullSecretName := include "telovix-sensor.pullSecretName" . }}
      {{- $imagePullSecrets := concat .Values.image.pullSecrets .Values.imagePullSecrets }}
      {{- if or $pullSecretName $imagePullSecrets }}
      imagePullSecrets:
        {{- if $pullSecretName }}
        - name: {{ $pullSecretName }}
        {{- end }}
        {{- with $imagePullSecrets }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      initContainers:
        - name: bpf-init
          image: {{ include "telovix-sensor.captureImage" . }}
          imagePullPolicy: {{ ternary "IfNotPresent" .Values.image.pullPolicy $split }}
          command:
            - /bin/sh
            - -c
            - |
              set -eu

              # ── BPF filesystem setup ────────────────────────────────────────
              if ! mountpoint -q /host-bpf 2>/dev/null; then
                mount -t bpf bpffs /host-bpf || true
              fi
              {{- if not $split }}
              rm -rf /host-bpf/telovix-sensor /host-bpf/telovix || true

              # ── Stale-credential detection ──────────────────────────────────
              # The sensor stores its mTLS client certificate in the hostPath
              # volume (/var/lib/telovix-sensor). When the enrollment token
              # changes — e.g. after a Console database wipe or token rotation —
              # the Console no longer recognises the old certificate and rejects
              # every heartbeat with 401 invalid_sensor_trust.
              #
              # This block detects the mismatch before the main container starts:
              #   1. Hash the current enrollment token (from the Kubernetes Secret).
              #   2. Compare with the hash written after the last successful enroll.
              #   3. On mismatch: delete the stale credentials so the sensor
              #      re-enrolls cleanly with the new token.
              #   4. Write the new hash so future restarts (same token) skip the wipe.
              #
              # This is idempotent and safe:
              #   • Same token, no cert files  > hash written, sensor enrolls fresh.
              #   • Same token, cert files OK  > hash matches, certs preserved.
              #   • Token changed              > old certs wiped, sensor re-enrolls.
              TOKEN_HASH=$(echo -n "${TELOVIX_ENROLLMENT_TOKEN}" | sha256sum | cut -d' ' -f1)
              STORED_HASH=$(cat /sensor-state/.enrollment-token-hash 2>/dev/null || true)
              if [ "${TOKEN_HASH}" != "${STORED_HASH}" ]; then
                echo "[telovix] enrollment token changed — clearing stale credentials for fresh enrollment"
                rm -f /sensor-state/client.key.pem \
                      /sensor-state/client-credentials.json \
                      /sensor-state/certificate-renewal.json \
                      /sensor-state/client.cert.pem \
                      /sensor-state/console-ca.cert.pem \
                      /sensor-state/sensor-state.json
                echo "${TOKEN_HASH}" > /sensor-state/.enrollment-token-hash
              fi
              {{- end }}

              {{- if $split }}
              owner_installation=/sensor-state/capture-owner-bin
              test ! -L "$owner_installation"
              if [ ! -e "$owner_installation" ]; then
                mkdir -m 0700 "$owner_installation"
              fi
              test -d "$owner_installation"
              test "$(stat -c '%u:%a' "$owner_installation")" = "$(id -u):700"
              owner_executable="$owner_installation/telovix-sensor"
              test ! -L "$owner_executable"
              if [ -e "$owner_executable" ]; then
                test -f "$owner_executable"
              fi
              journal=/sensor-state/.capture-owner-install.json
              if [ -e "$journal" ] || [ -L "$journal" ]; then
                # Recovery owns the installed file until its journal is reconciled.
                test -f "$journal"
                test ! -L "$journal"
                test -f "$owner_executable"
                test ! -L "$owner_executable"
              fi
              if [ -e "$owner_executable" ]; then
                # A committed handoff remains authoritative across pod recreation.
                test "$(stat -c '%u:%a' "$owner_executable")" = "$(id -u):555"
              fi
              incompatible_owner() {
                echo "[telovix] capture-owner compatibility check failed; fresh install required. Installed owner, recovery journal and Console record have not been removed." >&2
                exit 1
              }
              owner_contract() {
                metadata=$(timeout -k 5s 20s "$1" --capture-owner-info) || return 1
                # Metadata uses compact Sensor JSON; fail closed on unknown framing.
                case "$metadata" in
                  *'"delivery_protocol_version":9,'*) ;;
                  *) return 1 ;;
                esac
                printf '%s\n' "$metadata" | sed 's/"version":"[^"]*"/"version":""/'
              }
              image_contract=$(owner_contract /usr/local/bin/telovix-sensor) || incompatible_owner
              if [ -e "$owner_executable" ]; then
                installed_contract=$(owner_contract "$owner_executable") || incompatible_owner
                test "$installed_contract" = "$image_contract" || incompatible_owner
              else
                (
                  umask 077
                  temporary=$(mktemp "$owner_installation/.bootstrap.XXXXXX")
                  trap 'rm -f "$temporary"' 0
                  cp /usr/local/bin/telovix-sensor "$temporary"
                  chmod 0555 "$temporary"
                  mv -f "$temporary" "$owner_executable"
                )
              fi
              {{- end }}

              echo "[telovix] BPF filesystem ready"
          env:
            - name: TELOVIX_ENROLLMENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "telovix-sensor.secretName" . }}
                  key: enrollmentToken
          securityContext:
            privileged: true
            runAsUser: 0
          volumeMounts:
            - name: bpf
              mountPath: /host-bpf
              mountPropagation: Bidirectional
            - name: sensor-state
              mountPath: /sensor-state
      containers:
        - name: telovix-sensor
          image: {{ include "telovix-sensor.captureImage" . }}
          imagePullPolicy: {{ ternary "IfNotPresent" .Values.image.pullPolicy $split }}
          {{- if $split }}
          command: ["/usr/bin/tini", "--", "/var/lib/telovix-sensor/capture-owner-bin/telovix-sensor"]
          args: ["--capture-owner"]
          {{- end }}
          env:
            - name: TELOVIX_CONSOLE_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "telovix-sensor.fullname" . }}-config
                  key: consoleUrl
            - name: TELOVIX_ENROLLMENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "telovix-sensor.secretName" . }}
                  key: enrollmentToken
            {{- if .Values.sensor.nodeRole }}
            - name: TELOVIX_NODE_ROLE
              value: {{ .Values.sensor.nodeRole | quote }}
            {{- end }}
            - name: TELOVIX_NODE_NAME
              {{- if .Values.sensor.nodeNameOverride }}
              value: {{ .Values.sensor.nodeNameOverride | quote }}
              {{- else }}
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
              {{- end }}
            {{- if $split }}
            - name: TELOVIX_POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: TELOVIX_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: TELOVIX_POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- end }}
            - name: TELOVIX_CLUSTER_NAME
              valueFrom:
                configMapKeyRef:
                  name: {{ include "telovix-sensor.fullname" . }}-config
                  key: clusterName
            - name: TELOVIX_INSTALL_ID
              valueFrom:
                configMapKeyRef:
                  name: {{ include "telovix-sensor.fullname" . }}-config
                  key: installId
            - name: TELOVIX_K8S_DEPLOYMENT
              value: "true"
            {{- if .Values.sensor.bootstrapCaCertPath }}
            - name: TELOVIX_BOOTSTRAP_CA_CERT_PATH
              value: {{ .Values.sensor.bootstrapCaCertPath | quote }}
            {{- end }}
            - name: TELOVIX_SENSOR_TAGS
              value: {{ concat (list "deployment:helm" (printf "helm-release:%s" .Release.Name) (printf "helm-namespace:%s" .Release.Namespace)) (default (list) .Values.sensor.tags) | uniq | join "," | quote }}
            {{- if eq .Values.flavor "telecom" }}
            {{- with (get $telecomCapture "interfaces") }}
            - name: TELOVIX_MONITORING_INTERFACES
              value: {{ join "," . | quote }}
            {{- end }}
            {{- with (get $telecomCapture "networkNamespaces") }}
            - name: TELOVIX_MONITORING_NETNS
              value: {{ join "," . | quote }}
            {{- end }}
            {{- with (get $telecomCapture "ports") }}
            - name: TELOVIX_TELECOM_PORTS
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          readinessProbe:
            exec:
              command:
                {{- if $split }}
                - /var/lib/telovix-sensor/capture-owner-bin/telovix-sensor
                - --capture-owner-readiness
                {{- else }}
                - /bin/sh
                - -ec
                - test -s /var/lib/telovix-sensor/.sensor-ready
                {{- end }}
            periodSeconds: 10
            {{- if $split }}
            timeoutSeconds: 5
            {{- else }}
            timeoutSeconds: 1
            {{- end }}
            successThreshold: 1
            failureThreshold: 1
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: proc
              mountPath: /proc
              readOnly: true
            - name: bpf
              mountPath: /sys/fs/bpf
              mountPropagation: Bidirectional
            - name: sys
              mountPath: /sys
              readOnly: true
            - name: sensor-state
              mountPath: /var/lib/telovix-sensor
            - name: run
              mountPath: /host/run
              readOnly: true
            - name: etc
              mountPath: /host/etc
              readOnly: true
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: proc
          hostPath:
            path: /proc
            type: Directory
        - name: bpf
          hostPath:
            path: {{ .Values.bpfPath }}
            type: DirectoryOrCreate
        - name: sys
          hostPath:
            path: /sys
            type: Directory
        - name: sensor-state
          hostPath:
            path: {{ .Values.statePath }}
            type: DirectoryOrCreate
        - name: run
          hostPath:
            path: /run
            type: Directory
        - name: etc
          hostPath:
            path: /etc
            type: Directory
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
