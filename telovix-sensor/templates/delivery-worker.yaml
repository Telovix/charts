{{- $capture := .Values.captureDelivery | default dict -}}
{{- if get $capture "enabled" -}}
{{- $worker := get $capture "worker" | default dict -}}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "telovix-sensor.fullname" . | trunc 54 | trimSuffix "-" }}-delivery
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ include "telovix-sensor.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: delivery-worker
spec:
  minReadySeconds: {{ .Values.minReadySeconds }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "telovix-sensor.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: delivery-worker
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "telovix-sensor.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: delivery-worker
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      hostPID: false
      hostNetwork: false
      hostIPC: false
      dnsPolicy: ClusterFirst
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      affinity:
        {{- with .Values.affinity.nodeAffinity }}
        nodeAffinity:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  {{- include "telovix-sensor.selectorLabels" . | nindent 18 }}
              topologyKey: kubernetes.io/hostname
      {{- if .Values.priorityClass.create }}
      priorityClassName: {{ .Values.priorityClass.name }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- $pullSecret := include "telovix-sensor.pullSecretName" . }}
      {{- $pullSecrets := concat .Values.image.pullSecrets .Values.imagePullSecrets }}
      {{- if or $pullSecret $pullSecrets }}
      imagePullSecrets:
        {{- if $pullSecret }}
        - name: {{ $pullSecret }}
        {{- end }}
        {{- with $pullSecrets }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      containers:
        - name: delivery-worker
          image: {{ include "telovix-sensor.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["--delivery-worker"]
          env:
            - name: TELOVIX_CONSOLE_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "telovix-sensor.fullname" . }}-config
                  key: consoleUrl
            - name: TELOVIX_STATE_DIR
              value: /var/lib/telovix-sensor
            - name: TELOVIX_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: TELOVIX_K8S_DEPLOYMENT
              value: "true"
            {{- with (get $worker "extraEnv") }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          # This probe checks this worker's active lease without claiming another one.
          readinessProbe:
            exec:
              command:
                - /usr/local/bin/telovix-sensor
                - --delivery-worker-probe
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 1
          resources:
            {{- toYaml (get $worker "resources") | nindent 12 }}
          securityContext:
            runAsUser: 0
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: sensor-state
              mountPath: /var/lib/telovix-sensor
              readOnly: true
      volumes:
        - name: sensor-state
          hostPath:
            path: {{ .Values.statePath }}
            type: Directory
{{- end }}
