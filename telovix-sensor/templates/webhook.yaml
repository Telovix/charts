{{- if .Values.admission.enabled }}
{{- $consoleUrl := trimSuffix "/" (required "admission.consoleUrl is required when admission.enabled=true" .Values.admission.consoleUrl) }}
{{- if not (hasPrefix "https://" $consoleUrl) }}
{{- fail "admission.consoleUrl must start with https://" }}
{{- end }}
{{- $clusterName := required "clusterName is required when admission.enabled=true" .Values.clusterName }}
{{- if not (regexMatch "^[A-Za-z0-9._:-]{1,128}$" $clusterName) }}
{{- fail "clusterName must contain 1-128 letters, numbers, dots, underscores, colons, or hyphens" }}
{{- end }}
{{- $credential := required "admission.credential is required when admission.enabled=true; generate it from the Console Admission page" .Values.admission.credential }}
{{- if not (regexMatch "^[A-Za-z0-9_-]{43}$" $credential) }}
{{- fail "admission.credential must be the 43-character credential generated by the Console" }}
{{- end }}
{{- if not (has .Values.admission.failurePolicy (list "Fail" "Ignore")) }}
{{- fail "admission.failurePolicy must be Fail or Ignore" }}
{{- end }}
{{- if or (lt (int .Values.admission.timeoutSeconds) 1) (gt (int .Values.admission.timeoutSeconds) 30) }}
{{- fail "admission.timeoutSeconds must be between 1 and 30" }}
{{- end }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: {{ include "telovix-sensor.fullname" . }}-admission
  labels:
    {{- include "telovix-sensor.labels" . | nindent 4 }}
  annotations:
    # Admission webhook points to the Telovix Console API (external to cluster)
    telovix.com/console-url: {{ .Values.admission.consoleUrl | quote }}
webhooks:
  - name: admission.telovix.com
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: {{ .Values.admission.failurePolicy }}
    timeoutSeconds: {{ .Values.admission.timeoutSeconds }}
    clientConfig:
      url: {{ printf "%s/api/v1/kubernetes/admission/review/%s/%s" $consoleUrl $clusterName $credential | quote }}
      {{- if .Values.admission.caBundle }}
      caBundle: {{ .Values.admission.caBundle | quote }}
      {{- end }}
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods", "pods/ephemeralcontainers"]
        scope: "Namespaced"
    {{- if or .Values.admission.excludeNamespaces .Values.admission.includeNamespaces }}
    namespaceSelector:
      matchExpressions:
      {{- if .Values.admission.excludeNamespaces }}
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            {{- range .Values.admission.excludeNamespaces }}
            - {{ . | quote }}
            {{- end }}
      {{- end }}
      {{- if .Values.admission.includeNamespaces }}
        - key: kubernetes.io/metadata.name
          operator: In
          values:
            {{- range .Values.admission.includeNamespaces }}
            - {{ . | quote }}
            {{- end }}
      {{- end }}
    {{- end }}
    matchPolicy: Equivalent
{{- end }}
